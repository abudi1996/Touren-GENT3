<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fahrten">
<link rel="manifest" href="manifest.webmanifest">
<title>Fahrten</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;overscroll-behavior-x:none}
header{background:#111827;color:white;padding:18px 16px;padding-top:calc(18px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}.sub{opacity:.75;font-size:14px}
main{max-width:620px;margin:auto;padding:12px 14px calc(28px + env(safe-area-inset-bottom))}
.card{background:white;border-radius:20px;padding:20px;box-shadow:0 4px 18px #00000012;margin-bottom:14px}
.label{font-size:13px;color:#6b7280}.name{font-size:27px;font-weight:750;margin:5px 0}
.address{font-size:18px;line-height:1.35;margin:8px 0 18px}.meta{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:#eef2ff;border-radius:999px;padding:7px 11px;font-size:13px}
button{width:100%;border:0;border-radius:14px;padding:17px 16px;font-size:18px;font-weight:700;cursor:pointer;touch-action:manipulation}
.go{background:#16a34a;color:white;margin-top:18px}.next{background:#111827;color:white;margin-top:10px}.secondary{background:#e5e7eb;color:#111827;margin-top:10px;font-size:15px;padding:13px}
.swipe{display:flex;justify-content:space-between;gap:10px;margin:10px 0;color:#6b7280;font-size:13px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav button{background:#e5e7eb;color:#111827;padding:13px}
.progress{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:8px 0 14px}.bar{height:100%;background:#16a34a;transition:width .2s}
.notice{font-size:13px;color:#6b7280;line-height:1.45}
.done{text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header><h1>Fahrten</h1><div class="sub" id="counter"></div></header>
<main id="app"></main>
<script>
const stops=[
{time:"06:46",name:"Elisabeth Krug",address:"Gartenstraße 18, Östringen",klass:"5"},
{time:"07:11",name:"Nikita Blank",address:"Mozartweg 9, Bad Schönborn",klass:"5"},
{time:"07:12",name:"Burak Arslan",address:"Beethovenplatz 4, Bruchsal",klass:"8"},
{time:"07:27",name:"Jood Almadas",address:"Uferweg 5, Bruchsal",klass:"3"},
{time:"07:29",name:"Theodor Frech",address:"Nelly-Sachs-Straße 8, Bruchsal",klass:"4"},
{time:"07:55",name:"Parzival-Schulzentrum",address:"Parzivalstraße 1, Karlsruhe",klass:"—"},
{time:"08:13",name:"—",address:"August-Bebel-Straße 86, Karlsruhe",klass:"—"}
];
let i=Number(localStorage.getItem("fahrten_index")||0);
if(!Number.isInteger(i)||i<0||i>=stops.length)i=0;

function mapsUrl(a){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(a)+"&travelmode=driving&dir_action=navigate"}
function save(){localStorage.setItem("fahrten_index",i)}
function render(){
 const s=stops[i], pct=(i/(stops.length-1))*100;
 document.getElementById("counter").textContent=`Stopp ${i+1} von ${stops.length}`;
 document.getElementById("app").innerHTML=`
 <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
 <section class="card" id="swipeCard">
  <div class="label">Nächster Stopp · ${s.time} Uhr</div>
  <div class="name">${esc(s.name)}</div>
  <div class="address">${esc(s.address)}</div>
  <div class="meta"><span class="badge">Klasse: ${esc(s.klass)}</span><span class="badge">${i+1}/${stops.length}</span></div>
  <div class="swipe"><span>← zurück</span><span>wischen</span><span>weiter →</span></div>
  <button class="go" onclick="go()">🚗 Los – Navigation starten</button>
  ${i<stops.length-1?'<button class="next" onclick="next()">✓ Angekommen – nächster Stopp</button>':'<button class="next" onclick="finish()">✓ Fahrt beenden</button>'}
  <div class="nav">
   <button onclick="prev()" ${i===0?"disabled":""}>← Vorheriger</button>
   <button onclick="next()" ${i===stops.length-1?"disabled":""}>Nächster →</button>
  </div>
  <button class="secondary" onclick="reset()">Liste zurücksetzen</button>
 </section>
 <p class="notice">Du kannst auch direkt auf der Karte wischen: links = nächster Stopp, rechts = vorheriger Stopp. Der aktuelle Stopp wird automatisch gespeichert.</p>`;
 attachSwipe();
}
function go(){location.href=mapsUrl(stops[i].address)}
function next(){if(i<stops.length-1){i++;save();render();scrollTo(0,0)}}
function prev(){if(i>0){i--;save();render();scrollTo(0,0)}}
function reset(){if(confirm("Fortschritt wirklich zurücksetzen?")){i=0;save();render()}}
function finish(){alert("Fahrt abgeschlossen.");}
function attachSwipe(){
 const el=document.getElementById("swipeCard"); let x=0,y=0;
 el.addEventListener("touchstart",e=>{x=e.changedTouches[0].clientX;y=e.changedTouches[0].clientY},{passive:true});
 el.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-x, dy=e.changedTouches[0].clientY-y;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.3){dx<0?next():prev()}
 },{passive:true});
}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
render();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
